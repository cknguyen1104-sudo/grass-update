<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Speed Stars | 400m Cross Country</title><link rel="stylesheet" href="../mobile.css"></head><body><main><header><h1>SPEED STARS</h1><nav class="events"><a class="event" href="../original/" >Original events</a><a class="event" href="../400xc/" aria-current="page">400m Cross Country</a><a class="event" href="../600m/">600m Rolling Hills</a></nav></header><p id="hint">Select 400m run. Native one-lap race with grass track, two bale rows and a steeper continuous hill. Use ↑ or ↓ to hurdle.</p><section class="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Original Unity Speed Stars game"></canvas><p id="status" role="status">Loading original Unity engine…</p></section><p id="bale-status" style="font-size:13px;color:#bbc2ce">Hay-bale spawn diagnostic</p></main><script src="../mobile.js"></script><script>window.PokiSDK={init:()=>Promise.resolve(),gameLoadingStart:()=>{},gameLoadingFinished:()=>{},gameplayStart:()=>{},gameplayStop:()=>{},commercialBreak:()=>Promise.resolve(),rewardedBreak:()=>Promise.resolve(false),setDebug:()=>{}};</script><script>
Object.assign(window.PokiSDK,{getLanguage:()=>navigator.language.split('-')[0],getURLParam:n=>new URLSearchParams(location.search).get(n)||'',isAdBlocked:()=>false,logError:console.error,customEvent:()=>{},displayAd:()=>{},destroyAd:()=>{}});
let bridgeName;function notifyBridge(method,value){if(window.unityGame&&bridgeName){if(value===undefined)window.unityGame.SendMessage(bridgeName,method);else window.unityGame.SendMessage(bridgeName,method,value);}}
window.initPokiBridge=function(name){bridgeName=name;if(window.unityGame)notifyBridge('ready');};
window.commercialBreak=()=>notifyBridge('commercialBreakCompleted');window.rewardedBreak=()=>notifyBridge('rewardedBreakCompleted','false');window.shareableURL=()=>notifyBridge('shareableURLRejected');window.getUser=()=>notifyBridge('getUserRejected');window.getToken=()=>notifyBridge('getTokenRejected');window.login=()=>notifyBridge('loginRejected');
</script><script>
(function(){let counter=null;function capture(result){const ex=(result.instance||result).exports;if(ex&&ex.SS600BaleCount)counter=ex.SS600BaleCount;return result;}for(const key of ['instantiate','instantiateStreaming']){const original=WebAssembly[key];if(typeof original==='function')WebAssembly[key]=function(...args){return original.apply(this,args).then(capture);};}setInterval(()=>{const el=document.getElementById('bale-status');if(el&&counter){const n=counter.value;el.textContent=n<0?'Hay bales: waiting for race setup':'Native obstacle instances spawned: '+n+' (16 expected across 2 rows)';}},300);})();
</script><script src="../Build_v2-40w.loader.js"></script><script>
const canvas=document.getElementById('game'),status=document.getElementById('status');
if(!new URLSearchParams(location.search).has('nobale'))window.addEventListener('keydown',e=>{if((e.code==='ArrowUp'||e.code==='ArrowDown')&&(document.activeElement===canvas||document.activeElement===document.body))e.preventDefault();},{capture:true});
createUnityInstance(canvas,{...window.ssMobile.config,dataUrl:'../event400xc.data',frameworkUrl:'../framework.js',codeUrl:'../native400xc.wasm',streamingAssetsUrl:'../StreamingAssets',companyName:'Luke Doukakis',productName:'Speed Stars',productVersion:'2.40'},p=>status.textContent='Loading '+Math.round(p*100)+'%').then(instance=>{window.unityGame=instance;if(bridgeName)notifyBridge('ready');status.textContent='Original Unity engine loaded · 400m Cross Country';window.ssMobile.ready();canvas.focus();}).catch(e=>status.textContent='Unable to load game: '+String(e));</script></body></html>
